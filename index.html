<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyRestos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
	@keyframes winnerPulse {
    0% { transform: scale(1.02); shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); }
    70% { transform: scale(1.03); shadow: 0 0 0 15px rgba(99, 102, 241, 0); }
    100% { transform: scale(1.02); }
}

.random-winner {
    animation: winnerPulse 0.6s ease-out;
    background-color: #f5f3ff !important; /* Un très léger fond indigo */
}
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        .tab-active { background-color: #4f46e5; color: white; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); }
        @keyframes bounce-subtle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .random-winner { border: 3px solid #4f46e5 !important; animation: bounce-subtle 0.5s ease-in-out 3; background-color: #f5f3ff !important; }
        html { scroll-behavior: smooth; }
        .tag-btn.active { border-color: #4f46e5 !important; background-color: #eef2ff !important; color: #4f46e5 !important; transform: scale(1.05); }
        /* Style pour les suggestions de ville */
        #citySuggestions { max-height: 200px; overflow-y: auto; z-index: 100; }
    </style>
</head>
<body class="bg-slate-50 p-4 max-w-md mx-auto pb-20">

    <header class="sticky top-0 z-40 bg-slate-50/90 backdrop-blur-md pt-4 pb-2 mb-2 px-1">
        <div class="flex justify-between items-center bg-white p-3 rounded-[1.8rem] border border-gray-100 shadow-sm">
            <div class="flex items-center gap-2 pl-1" onclick="location.reload()" style="cursor:pointer">
                <span class="text-2xl">🍴</span>
                <h1 class="text-xl font-black text-indigo-600 tracking-tight">MyRestos</h1>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="scrollToAdd()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-10 h-10 flex items-center justify-center rounded-xl shadow-md transition active:scale-90">
                    <span class="text-2xl font-light">+</span>
                </button>
                <button onclick="pickRandom()" class="bg-amber-400 hover:bg-amber-500 text-white px-4 h-10 flex items-center gap-2 rounded-xl shadow-md transition active:scale-90">
                    <span class="text-[10px] font-black uppercase tracking-tighter">SURPRIZME</span><span class="text-xl">🎲</span>
                </button>
            </div>
        </div>
    </header>

    <nav id="mainNav" class="sticky top-[80px] z-30 mb-6 pt-1">
        <div class="flex bg-white/80 backdrop-blur-md rounded-2xl p-1 shadow-sm border border-gray-100 font-bold text-[10px]">
            <button id="btnTabFait" onclick="setViewState('Fait')" class="flex-1 py-3 rounded-xl transition tab-active">J'ai testé</button>
            <button id="btnTabAFaire" onclick="setViewState('À faire')" class="flex-1 py-3 rounded-xl transition text-gray-400">À découvrir</button>
            <button id="btnTabSearch" onclick="setViewState('Recherche')" class="flex-1 py-3 rounded-xl transition text-gray-400">🔍 Chercher</button>
        </div>
    </nav>

    <div id="searchSection" class="hidden mb-8 space-y-3">
        <div class="bg-white p-4 rounded-3xl shadow-xl border border-indigo-100">
            <input type="text" id="searchQuery" oninput="render()" placeholder="Nom ou ville..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none mb-3 text-sm">
            <p class="text-[9px] font-black text-gray-400 uppercase mb-2 ml-1 tracking-widest text-center">Catégories</p>
            <div id="searchTagsContainer" class="flex flex-wrap justify-center gap-2 mb-3"></div>
            <select id="searchBudget" onchange="render()" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-gray-600 font-bold text-sm">
                <option value="">Tous les budgets</option><option value="€">€</option><option value="€€">€€</option><option value="€€€">€€€</option><option value="€€€€">€€€€</option>
            </select>
        </div>
    </div>

    <details id="addSection" class="mb-8 group">
        <summary class="list-none bg-indigo-50 text-indigo-700 p-4 rounded-2xl font-bold text-center cursor-pointer group-open:mb-4"> + Ajouter un restaurant</summary>
        <form id="restoForm" class="bg-white p-6 rounded-3xl shadow-xl border border-gray-100">
            <div class="space-y-4">
                <input type="text" id="name" placeholder="Nom du restaurant" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm" required>
                
                <!-- CHAMP VILLE AVEC AUTOCOMPLÉTION -->
                <div class="relative">
                    <input type="text" id="city" autocomplete="off" placeholder="Ville..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm" required>
                    <div id="citySuggestions" class="absolute left-0 right-0 bg-white border border-gray-100 rounded-2xl shadow-xl hidden mt-1 overflow-hidden"></div>
                </div>

                <div>
                    <p class="text-[10px] font-black text-gray-400 uppercase mb-2 ml-1 tracking-widest">Cuisine</p>
                    <div class="flex flex-wrap gap-2" id="tagContainer"></div>
                </div>
                <div id="formFaitExtras" class="space-y-3">
                    <div class="flex gap-2">
                        <select id="budget" class="flex-1 p-4 bg-slate-50 rounded-2xl outline-none text-sm"><option value="">Budget ?</option><option value="€">€</option><option value="€€">€€</option><option value="€€€">€€€</option><option value="€€€€">€€€€</option></select>
                        <select id="moment" class="flex-1 p-4 bg-slate-50 rounded-2xl outline-none text-sm"><option value="Midi">☀️ Midi</option><option value="Soir">🌙 Soir</option><option value="Midi et Soir">🌗 Les deux</option></select>
                    </div>
                    <select id="rating" class="w-full p-4 bg-slate-50 rounded-2xl text-orange-500 font-bold text-xl outline-none"><option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option></select>
                </div>
                <input type="text" id="comment" placeholder="Commentaire..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm">
                <input type="text" id="user" placeholder="Ton nom" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold text-indigo-600 text-sm" required>
                <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg">ENREGISTRER</button>
            </div>
        </form>
    </details>
	<!-- MODAL DE MODIFICATION RAPIDE -->
<div id="quickEditModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-6">
    <div class="bg-white w-full max-w-xs rounded-[2rem] p-6 shadow-2xl">
        <h3 id="quickEditTitle" class="font-black text-slate-800 text-center mb-4"></h3>
        <div id="quickEditTags" class="flex flex-wrap gap-2 justify-center mb-6"></div>
        <button onclick="closeQuickEdit()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm">Fermer</button>
    </div>
</div>

    <div id="listContainer" class="space-y-4"></div>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/lwe5ipx4o126r"; 
        const CAT_API_URL = "https://sheetdb.io/api/v1/lwe5ipx4o126r?sheet=categories";
        
        let allData = [];
        let categories = [];
        let selectedAddCategories = []; 
        let selectedSearchCategories = []; 
        let viewState = "Fait";

        // GESTION AUTOCOMPLÉTION VILLE
        const cityInput = document.getElementById('city');
        const suggestionsBox = document.getElementById('citySuggestions');

        cityInput.addEventListener('input', async (e) => {
            const query = e.target.value;
            if (query.length < 3) {
                suggestionsBox.classList.add('hidden');
                return;
            }

            try {
                // Appel à l'API Photon (OpenStreetMap)
                const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=5&lang=fr&type=city`);
                const data = await res.json();
                
                if (data.features.length > 0) {
                    suggestionsBox.innerHTML = data.features.map(f => {
                        const name = f.properties.name;
                        const postcode = f.properties.postcode ? `(${f.properties.postcode})` : "";
                        return `<div class="p-4 hover:bg-indigo-50 cursor-pointer text-sm border-b border-gray-50 last:border-0" 
                                     onclick="selectCity('${name.replace(/'/g, "\\'")}')">
                                    <span class="font-bold">${name}</span> <span class="text-gray-400 text-xs">${postcode}</span>
                                </div>`;
                    }).join('');
                    suggestionsBox.classList.remove('hidden');
                } else {
                    suggestionsBox.classList.add('hidden');
                }
            } catch (err) { console.error("Erreur géo:", err); }
        });

        function selectCity(cityName) {
            cityInput.value = cityName;
            suggestionsBox.classList.add('hidden');
        }

        // Fermer les suggestions si on clique ailleurs
        document.addEventListener('click', (e) => {
            if (!cityInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
                suggestionsBox.classList.add('hidden');
            }
        });

        // --- FONCTIONS EXISTANTES CORRIGÉES ---

        function scrollToAdd() {
            document.getElementById('addSection').open = true;
            document.getElementById('name').focus();
            window.scrollTo({ top: document.getElementById('addSection').offsetTop - 20, behavior: 'smooth' });
        }

        async function fetchCategories() {
            try {
                const res = await fetch(CAT_API_URL);
                const data = await res.json();
                categories = data.map(c => c.nom);
                renderCategoryButtons();
                renderSearchFilters();
            } catch(e) { console.error(e); }
        }

        function renderCategoryButtons() {
            document.getElementById('tagContainer').innerHTML = categories.map(c => `
                <button type="button" onclick="toggleAddTag(this, '${c.replace(/'/g, "\\'")}')" class="tag-btn border border-gray-200 px-3 py-2 rounded-xl text-[10px] font-bold text-gray-500 bg-white transition-all">
                    ${c}
                </button>
            `).join('');
        }

        function toggleAddTag(btn, cat) {
            if (selectedAddCategories.includes(cat)) {
                selectedAddCategories = selectedAddCategories.filter(c => c !== cat);
                btn.classList.remove('active');
            } else {
                selectedAddCategories.push(cat);
                btn.classList.add('active');
            }
        }

        function renderSearchFilters() {
            document.getElementById('searchTagsContainer').innerHTML = categories.map(cat => {
                const active = selectedSearchCategories.includes(cat);
                return `<button onclick="toggleSearchCategory('${cat.replace(/'/g, "\\'")}')" class="px-3 py-1.5 rounded-full text-[9px] font-bold border transition-all ${active ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-400 border-gray-100'}">${cat}</button>`;
            }).join('');
        }

        function toggleSearchCategory(cat) {
            if (selectedSearchCategories.includes(cat)) { selectedSearchCategories = selectedSearchCategories.filter(c => c !== cat); } 
            else { selectedSearchCategories.push(cat); }
            renderSearchFilters(); render();
        }

        function getFilteredData() {
    const q = document.getElementById('searchQuery').value.toLowerCase();
    const bF = document.getElementById('searchBudget').value;
    
    return allData.filter(r => {
        // 1. GESTION DU STATUT SELON L'ONGLET
        const matchTab = (viewState === 'Recherche') ? true : (r.statut === viewState);
        if (!matchTab) return false;

        // 2. RECHERCHE TEXTUELLE (Nom ou Ville) - Toujours prioritaire
        const matchText = r.nom.toLowerCase().includes(q) || r.ville.toLowerCase().includes(q);
        if (!matchText) return false;

        // 3. LOGIQUE SPÉCIFIQUE POUR L'ONGLET RECHERCHE
        if (viewState === 'Recherche') {
            // Si le resto n'est pas encore fait, on l'affiche dès que la ville/nom match (on ignore les tags/budget)
            if (r.statut === 'À faire') {
                return true; 
            }
            
            // Si le resto est "Fait", on applique les filtres de précision
            const matchBudget = !bF || r.budget === bF;
            const matchCat = selectedSearchCategories.length === 0 || 
                             selectedSearchCategories.some(cat => (r.categorie || "").includes(cat));
            
            return matchBudget && matchCat;
        }

        // 4. LOGIQUE POUR LES AUTRES ONGLETS (Fait / À faire)
        // On garde les filtres classiques pour l'onglet "J'ai testé"
        if (viewState === 'Fait') {
            const matchBudget = !bF || r.budget === bF;
            const matchCat = selectedSearchCategories.length === 0 || 
                             selectedSearchCategories.some(cat => (r.categorie || "").includes(cat));
            return matchBudget && matchCat;
        }

        return true; 
    });
}

     function render(highlightName = null) {
    const container = document.getElementById('listContainer');
    let filtered = getFilteredData().reverse();
    
   		container.innerHTML = filtered.map(r => {
    const tags = (r.categorie || "").split(',').filter(x => x.trim() !== "");
    let momentIcon = r.moment === "Midi" ? "☀️" : (r.moment === "Soir" ? "🌙" : "🌗");
    const isFait = r.statut === 'Fait';
    const isWinner = highlightName === r.nom; // On définit le gagnant ici

    return `
    <div id="resto-${r.nom.replace(/\s+/g, '')}" 
         class="bg-white p-3 rounded-[1.8rem] shadow-sm border flex flex-col mb-2 transition-all duration-500 
         ${isWinner ? 'ring-4 ring-indigo-500 border-indigo-500 scale-[1.02] z-10 shadow-xl random-winner' : 'border-gray-100'}">
        
        <!-- LIGNE 1 : NOM ET BOUTON ACTION -->
        <div class="flex justify-between items-center">
             <h3 class="font-black text-slate-800 text-lg tracking-tight truncate pr-2">${r.nom}</h3>
                ${!isFait ? `
                    <button class="bg-[#1ED760] text-white px-3 py-1.5 rounded-xl text-[10px] font-black uppercase shadow-sm">J'Y SUIS !</button>
                ` : `
                    <div class="text-orange-400 text-[10px] tracking-widest">${"★".repeat(r.note)}</div>
                `}
            </div>

            <!-- LIGNE 2 : VILLE ET TAGS (COLLÉS) -->
            <div class="flex flex-wrap items-center gap-1.5 mt-0.5">
                <div class="flex items-center gap-0.5">
                    <span class="text-[10px]">📍</span>
                    <span class="text-indigo-400 font-bold uppercase text-[9px] tracking-widest">${r.ville}</span>
                </div>
                ${tags.map(c => `<span class="bg-indigo-50 text-indigo-600 text-[8px] px-2 py-0.5 rounded-full font-black uppercase">${c.trim()}</span>`).join('')}
                ${isFait ? `<span class="text-[10px] ml-auto">${momentIcon}</span>` : ''}
            </div>

            <!-- LIGNE 3 : COMMENTAIRE (DISCRET) -->
            ${r.commentaire ? `
                <div class="mt-1.5 border-l-2 border-indigo-50 pl-2">
                    <p class="text-slate-400 text-[11px] italic leading-tight line-clamp-2">"${r.commentaire}"</p>
                </div>
            ` : ''}

            <!-- LIGNE 4 : ACTIONS (COMPACTÉES) -->
            <div class="flex justify-between items-center mt-2 pt-2 border-t border-slate-50">
                <button onclick="openQuickEdit('${r.nom.replace(/'/g, "\\'")}')" class="bg-slate-50 text-slate-400 px-3 py-1 rounded-lg text-[9px] font-black uppercase">
                    Cat
                </button>

                ${isFait ? `
                    <div class="flex gap-2">
                        <button onclick="vote('${r.nom.replace(/'/g, "\\'")}', 'likes')" class="flex items-center gap-1 bg-blue-50/50 text-blue-600 px-2 py-1 rounded-lg">
                            <span class="text-xs">👍</span>
                            <span class="font-black text-[10px]">${r.likes || 0}</span>
                        </button>
                        <button onclick="vote('${r.nom.replace(/'/g, "\\'")}', 'dislikes')" class="flex items-center gap-1 bg-red-50/50 text-red-600 px-2 py-1 rounded-lg">
                            <span class="text-xs">👎</span>
                            <span class="font-black text-[10px]">${r.dislikes || 0}</span>
                        </button>
                        <span class="text-green-600 font-black text-[10px] self-center ml-1">${r.budget || ''}</span>
                    </div>
                ` : ''}
            </div>
        </div>`;
    }).join('');
}

        function pickRandom() {
            const pool = getFilteredData();
            if (pool.length === 0) return;
            const winner = pool[Math.floor(Math.random() * pool.length)];
            render(winner.nom);
            setTimeout(() => { 
                const el = document.getElementById(`resto-${winner.nom.replace(/\s+/g, '')}`);
                if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 500);
        }

        document.getElementById('restoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit'); btn.disabled = true;
            const payload = {
                nom: document.getElementById('name').value, ville: document.getElementById('city').value,
                statut: viewState, categorie: selectedAddCategories.join(','),
                note: document.getElementById('rating').value, budget: document.getElementById('budget').value,
                moment: document.getElementById('moment').value, commentaire: document.getElementById('comment').value,
                evaluateur: document.getElementById('user').value
            };
            await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: [payload] }) });
            location.reload(); 
        });

        async function fetchRestos() { const r = await fetch(API_URL); allData = await r.json(); render(); }
        function setViewState(s) { 
            viewState = s; 
            document.getElementById('btnTabFait').className = `flex-1 py-3 rounded-xl transition ${s === 'Fait' ? 'tab-active' : 'text-gray-400'}`;
            document.getElementById('btnTabAFaire').className = `flex-1 py-3 rounded-xl transition ${s === 'À faire' ? 'tab-active' : 'text-gray-400'}`;
            document.getElementById('btnTabSearch').className = `flex-1 py-3 rounded-xl transition ${s === 'Recherche' ? 'tab-active' : 'text-gray-400'}`;
            document.getElementById('searchSection').classList.toggle('hidden', s !== 'Recherche');
            render(); 
        }

        window.onload = () => { fetchRestos(); fetchCategories(); };
    
	let currentEditingResto = null;

function openQuickEdit(restoName) {
    currentEditingResto = allData.find(r => r.nom === restoName);
    if (!currentEditingResto) return;

    document.getElementById('quickEditTitle').innerText = "Catégories : " + restoName;
    renderQuickEditTags();
    document.getElementById('quickEditModal').classList.remove('hidden');
}

function renderQuickEditTags() {
    const container = document.getElementById('quickEditTags');
    // On récupère les catégories actuelles du resto
    const currentTags = (currentEditingResto.categorie || "").split(',').map(t => t.trim());

    container.innerHTML = categories.map(cat => {
        const isActive = currentTags.includes(cat);
        return `
            <button onclick="updateRestoCategory('${cat.replace(/'/g, "\\'")}')" 
                class="px-3 py-1.5 rounded-lg text-[10px] font-bold border transition-all 
                ${isActive ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-400 border-slate-100'}">
                ${cat}
            </button>`;
    }).join('');
}

async function updateRestoCategory(cat) {
    let currentTags = (currentEditingResto.categorie || "").split(',').filter(t => t.trim() !== "");
    
    if (currentTags.includes(cat)) {
        currentTags = currentTags.filter(t => t !== cat);
    } else {
        currentTags.push(cat);
    }

    const newTags = currentTags.join(',');
    currentEditingResto.categorie = newTags; // Mise à jour locale

    // Mise à jour sur SheetDB (on cherche par nom)
    try {
        await fetch(`${API_URL}/nom/${encodeURIComponent(currentEditingResto.nom)}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ data: { categorie: newTags } })
        });
        renderQuickEditTags();
        render(); // Rafraîchit la liste en arrière-plan
    } catch (e) {
        console.error("Erreur de mise à jour:", e);
    }
}

function closeQuickEdit() {
    document.getElementById('quickEditModal').classList.add('hidden');
    currentEditingResto = null;
}
	
	</script>
	
</body>
</html>
