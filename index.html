<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Napster Resto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); }
        .tab-active { background-color: #4f46e5; color: white; shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); }
        @keyframes bounce-subtle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .random-winner { border: 3px solid #4f46e5 !important; animation: bounce-subtle 0.5s ease-in-out 3; background-color: #f5f3ff !important; }
        /* Smooth scroll pour le retour en haut */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-slate-50 p-4 max-w-md mx-auto pb-20">

    <!-- HEADER STICKY : Titre + Actions (Dé et Ajout) -->
    <header class="sticky top-0 z-40 bg-slate-50/90 backdrop-blur-md pt-4 pb-2 mb-2">
        <div class="flex justify-between items-center bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">
            <h1 class="text-xl font-black text-indigo-600 tracking-tight pl-1">🍴 MyRestos</h1>
            
            <div class="flex gap-2">
                <!-- Nouveau Bouton + -->
                <button onclick="scrollToAdd()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-10 h-10 flex items-center justify-center rounded-xl shadow-md transition active:scale-90" title="Ajouter un resto">
                    <span class="text-xl font-bold">+</span>
                </button>
                <!-- Bouton Dé -->
                <button onclick="pickRandom()" class="bg-amber-400 hover:bg-amber-500 text-white w-10 h-10 flex items-center justify-center rounded-xl shadow-md transition active:scale-90" title="Lancer le destin">
                    <span class="text-xl">🎲</span>
                </button>
            </div>
        </div>
    </header>

    <!-- NAVIGATION STICKY (Juste en dessous du titre) -->
    <nav class="sticky top-[80px] z-30 mb-6 pt-1">
        <div class="flex bg-white/80 backdrop-blur-md rounded-2xl p-1 shadow-sm border border-gray-100 font-bold text-[10px]">
            <button id="btnTabFait" onclick="setViewState('Fait')" class="flex-1 py-3 rounded-xl transition tab-active">J'ai testé</button>
            <button id="btnTabAFaire" onclick="setViewState('À faire')" class="flex-1 py-3 rounded-xl transition text-gray-400">À découvrir</button>
            <button id="btnTabSearch" onclick="setViewState('Recherche')" class="flex-1 py-3 rounded-xl transition text-gray-400">🔍 Chercher</button>
        </div>
    </nav>

    <!-- Section Recherche (Masquée par défaut) -->
    <div id="searchSection" class="hidden mb-8 space-y-3">
        <div class="bg-white p-4 rounded-3xl shadow-xl border border-indigo-100">
            <input type="text" id="searchQuery" oninput="render()" placeholder="Nom ou ville..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none mb-3 text-sm">
            <select id="searchBudget" onchange="render()" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-gray-600 font-bold text-sm">
                <option value="">Tous les budgets</option>
                <option value="€">€ (Éco)</option><option value="€€">€€ (Moyen)</option><option value="€€€">€€€ (Chic)</option><option value="€€€€">€€€€ (Luxe)</option>
            </select>
        </div>
    </div>

    <!-- Formulaire d'ajout (avec ID pour le scroll) -->
    <details id="addSection" class="mb-8 group">
        <summary id="addSummary" class="list-none bg-indigo-50 text-indigo-700 p-4 rounded-2xl font-bold text-center cursor-pointer group-open:mb-4 transition-all">
            + Ajouter un nouveau restaurant
        </summary>
        <form id="restoForm" class="bg-white p-6 rounded-3xl shadow-xl border border-gray-100">
            <div class="space-y-3">
                <input type="text" id="name" placeholder="Nom du restaurant" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm" required>
                <input type="text" id="city" placeholder="Ville" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm" required>
                <div id="formFaitExtras" class="space-y-3">
                    <div class="flex gap-2">
                        <select id="budget" class="flex-1 p-4 bg-slate-50 rounded-2xl outline-none text-sm">
                            <option value="">Budget ?</option><option value="€">€</option><option value="€€">€€</option><option value="€€€">€€€</option><option value="€€€€">€€€€</option>
                        </select>
                        <select id="moment" class="flex-1 p-4 bg-slate-50 rounded-2xl outline-none text-sm">
                            <option value="Midi">☀️ Midi</option><option value="Soir">🌙 Soir</option><option value="Midi et Soir">🌗 Les deux</option>
                        </select>
                    </div>
                    <select id="rating" class="w-full p-4 bg-slate-50 rounded-2xl text-orange-500 font-bold text-xl outline-none">
                        <option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option>
                    </select>
                </div>
                <input type="text" id="comment" placeholder="Commentaire..." class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm">
                <input type="text" id="user" placeholder="Ton nom" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold text-indigo-600 text-sm" required>
                <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-lg">ENREGISTRER</button>
            </div>
        </form>
    </details>

    <div id="listContainer" class="space-y-4"></div>

    <!-- Modal Mise à jour (inchangé) -->
    <div id="updateModal" class="modal items-center justify-center p-6">
        <div class="bg-white w-full max-w-sm rounded-[2rem] p-8 shadow-2xl">
            <h2 class="text-2xl font-black text-gray-800 mb-1">C'était comment ?</h2>
            <p id="modalRestoName" class="text-indigo-500 font-bold mb-6 italic text-sm"></p>
            <div class="space-y-4">
                <div class="flex gap-2">
                    <select id="updateBudget" class="flex-1 p-4 bg-slate-50 rounded-2xl outline-none text-sm font-bold">
                        <option value="€">€</option><option value="€€">€€</option><option value="€€€">€€€</option><option value="€€€€">€€€€</option>
                    </select>
                    <select id="updateMoment" class="flex-1 p-4 bg-slate-50 rounded-2xl outline-none text-sm">
                        <option value="Midi">Midi</option><option value="Soir">Soir</option><option value="Midi et Soir">Midi & Soir</option>
                    </select>
                </div>
                <select id="updateRating" class="w-full p-4 bg-slate-50 rounded-2xl text-orange-500 font-bold text-lg outline-none">
                    <option value="5">⭐⭐⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option><option value="3">⭐⭐⭐</option><option value="2">⭐⭐</option><option value="1">⭐</option>
                </select>
                <textarea id="updateComment" class="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm" rows="2" placeholder="Ton avis..."></textarea>
                <input type="text" id="updateUser" class="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold text-indigo-600 text-sm" placeholder="Ton nom">
                <div class="flex gap-4 pt-4">
                    <button onclick="closeModal()" class="flex-1 py-4 text-gray-400 font-bold">Annuler</button>
                    <button onclick="submitUpdate()" class="flex-1 py-4 bg-green-500 text-white rounded-2xl font-bold shadow-lg">VALIDER</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://sheetdb.io/api/v1/lwe5ipx4o126r"; 
        let allData = [];
        let viewState = "Fait"; 
        let currentUpdateName = "";

        // --- NOUVELLE FONCTION : AJOUT RAPIDE ---
        function scrollToAdd() {
            // 1. Si on est en mode recherche, on repasse sur un mode d'ajout
            if (viewState === 'Recherche') setViewState('À faire');
            
            // 2. On ouvre le formulaire <details>
            const details = document.getElementById('addSection');
            details.open = true;
            
            // 3. On scrolle vers le formulaire
            details.scrollIntoView({ behavior: 'smooth', block: 'center' });
            
            // 4. Petit focus sur le nom pour gagner du temps
            document.getElementById('name').focus();
        }

        function setViewState(state) {
            viewState = state;
            document.getElementById('btnTabFait').className = `flex-1 py-3 rounded-xl transition ${state === 'Fait' ? 'tab-active' : 'text-gray-400'}`;
            document.getElementById('btnTabAFaire').className = `flex-1 py-3 rounded-xl transition ${state === 'À faire' ? 'tab-active' : 'text-gray-400'}`;
            document.getElementById('btnTabSearch').className = `flex-1 py-3 rounded-xl transition ${state === 'Recherche' ? 'tab-active' : 'text-gray-400'}`;
            document.getElementById('addSection').style.display = state === 'Recherche' ? 'none' : 'block';
            document.getElementById('searchSection').style.display = state === 'Recherche' ? 'block' : 'none';
            document.getElementById('formFaitExtras').style.display = state === 'Fait' ? 'block' : 'none';
            render();
        }

        async function fetchRestos() {
            try {
                const res = await fetch(API_URL);
                allData = await res.json();
                render();
            } catch (e) { console.error(e); }
        }

        async function vote(nom, type) {
            const resto = allData.find(r => r.nom === nom);
            const currentVotes = parseInt(resto[type] || 0);
            const newData = {}; newData[type] = currentVotes + 1;
            resto[type] = currentVotes + 1;
            render();
            await fetch(`${API_URL}/nom/${encodeURIComponent(nom)}`, {
                method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ data: newData })
            });
        }

        function render(highlightName = null) {
            const container = document.getElementById('listContainer');
            let filtered = [];

            if (viewState === 'Recherche') {
                const query = document.getElementById('searchQuery').value.toLowerCase();
                const budgetFilter = document.getElementById('searchBudget').value;
                filtered = allData.filter(r => {
                    const matchText = r.nom.toLowerCase().includes(query) || r.ville.toLowerCase().includes(query);
                    const isAFaire = r.statut === "À faire";
                    const isFaitMatchBudget = r.statut === "Fait" && (!budgetFilter || r.budget === budgetFilter);
                    return matchText && (isAFaire || isFaitMatchBudget);
                });
            } else {
                filtered = allData.filter(r => r.statut === viewState);
            }

            filtered = filtered.reverse();
            if (filtered.length === 0) { container.innerHTML = `<p class="text-center py-10 text-gray-300 italic">Aucun résultat...</p>`; return; }

            container.innerHTML = filtered.map(r => {
                const isWinner = highlightName === r.nom;
                const mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(r.nom + ' ' + r.ville)}`;
                const commentText = r.commentaire ? `"${r.commentaire}"` : "";
                const authorText = r.evaluateur ? ` — Ajouté par ${r.evaluateur}` : "";

                return `
                <div id="resto-${r.nom.replace(/\s+/g, '')}" class="bg-white p-5 rounded-[1.5rem] border ${isWinner ? 'random-winner' : 'border-gray-100'} shadow-sm transition-all flex flex-col gap-3">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <a href="${mapsUrl}" target="_blank" class="flex items-center gap-2 group">
                                <h3 class="font-black text-slate-800 text-lg leading-tight underline decoration-indigo-100 underline-offset-4">${r.nom}</h3>
                                <span class="text-indigo-400 text-xs">↗️</span>
                            </a>
                            <p class="text-[10px] text-indigo-400 font-bold uppercase mt-1 tracking-widest">📍 ${r.ville} ${r.moment ? '• '+r.moment : ''}</p>
                        </div>
                        <div class="text-right">
                            ${r.statut === 'Fait' 
                                ? `<div class="text-orange-400 font-bold text-sm">${"★".repeat(r.note)}</div><div class="text-[10px] font-black text-green-600 mt-1">${r.budget || ''}</div>`
                                : `<button onclick="openUpdateModal('${r.nom.replace(/'/g, "\\'")}')" class="bg-green-500 text-white px-4 py-2 rounded-xl text-[10px] font-black shadow-md">J'Y SUIS !</button>`
                            }
                        </div>
                    </div>
                    ${(commentText || authorText) ? `<p class="text-slate-400 text-xs border-l-2 border-indigo-50 pl-3 italic">${commentText}${authorText}</p>` : ''}
                    ${r.statut === 'Fait' ? `
                        <div class="flex justify-end gap-2">
                            <button onclick="vote('${r.nom.replace(/'/g, "\\'")}', 'likes')" class="flex items-center gap-1.5 text-[11px] font-bold bg-blue-50 text-blue-600 px-3 py-1.5 rounded-lg active:scale-90 transition">👍 ${r.likes || 0}</button>
                            <button onclick="vote('${r.nom.replace(/'/g, "\\'")}', 'dislikes')" class="flex items-center gap-1.5 text-[11px] font-bold bg-red-50 text-red-600 px-3 py-1.5 rounded-lg active:scale-90 transition">👎 ${r.dislikes || 0}</button>
                        </div>
                    ` : ''}
                </div>
                `;
            }).join('');
        }

        function openUpdateModal(name) { currentUpdateName = name; document.getElementById('modalRestoName').innerText = name; document.getElementById('updateModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('updateModal').style.display = 'none'; }

        document.getElementById('restoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit'); btn.disabled = true;
            const payload = {
                nom: document.getElementById('name').value, ville: document.getElementById('city').value,
                statut: viewState, note: viewState === "Fait" ? document.getElementById('rating').value : "",
                budget: viewState === "Fait" ? document.getElementById('budget').value : "",
                moment: viewState === "Fait" ? document.getElementById('moment').value : "",
                commentaire: document.getElementById('comment').value, evaluateur: document.getElementById('user').value
            };
            await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: [payload] }) });
            document.getElementById('restoForm').reset(); document.querySelector('details').open = false; fetchRestos(); btn.disabled = false;
        });

        async function submitUpdate() {
            const updateData = {
                statut: "Fait", note: document.getElementById('updateRating').value, budget: document.getElementById('updateBudget').value,
                moment: document.getElementById('updateMoment').value, commentaire: document.getElementById('updateComment').value, evaluateur: document.getElementById('updateUser').value
            };
            await fetch(`${API_URL}/nom/${encodeURIComponent(currentUpdateName)}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: updateData }) });
            closeModal(); fetchRestos();
        }

        function pickRandom() {
            setViewState('Recherche');
            const pool = allData.filter(r => r.statut === "À faire" || r.statut === "Fait");
            if (pool.length === 0) return;
            const winner = pool[Math.floor(Math.random() * pool.length)];
            render(winner.nom);
            setTimeout(() => { 
                const el = document.getElementById(`resto-${winner.nom.replace(/\s+/g, '')}`);
                if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 500);
        }

        fetchRestos();
    </script>
</body>
</html>
